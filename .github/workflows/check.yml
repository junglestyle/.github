# This repo's own checks: sync.sh's tests, shellcheck, and ruff.toml. Every repo's standards check runs sync.sh
# from main, so a change reaches main only with this green.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make check
