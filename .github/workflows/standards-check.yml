# Called by each repo's CI: fails if the repo's copies of code-standards/ (docs/org-standards.md, and
# docs/org-standards-<topic>.md for each topic in .org-standards) aren't unchanged copies of this repo's files.
name: standards-check
on:
  workflow_call:
    inputs:
      standards_ref:
        description: The ref of junglestyle/.github to check against. Callers on main leave it unset.
        type: string
        default: main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: junglestyle/.github
          ref: ${{ inputs.standards_ref }}
          path: .org
      - run: .org/code-standards/sync.sh check .org
