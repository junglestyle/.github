# Called by each repo's CI: fails if docs/org-standards.md isn't an unchanged copy of this repo's STANDARDS.md on main.
name: standards-check
on:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: junglestyle/.github
          ref: main
          path: .org
      - shell: bash
        run: |
          diff -u .org/STANDARDS.md <(tail -n +2 docs/org-standards.md) \
            || { echo "docs/org-standards.md differs from the org's STANDARDS.md: run make sync-standards"; exit 1; }
